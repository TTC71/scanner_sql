<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Scanner Produit</title>
</head>
<body>
  <h1>Scanner un produit</h1>
  <button onclick="importerCSV()" style="padding:10px 20px; margin-top:20px;">📥 Importer les nouveaux produits</button>
  <p id="import-result"></p>

  <script>
  function importerCSV() {
    fetch("/importer")
      .then(res => res.json())
      .then(data => {
        document.getElementById("import-result").textContent = data.message || "Import terminé.";
      })
      .catch(() => {
        document.getElementById("import-result").textContent = "Erreur lors de l'import.";
      });
  }
  </script>
</body>
</html>
